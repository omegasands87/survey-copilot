[package]
name = "survey-copilot"
version = "0.1.0"
description = "Survey Copilot desktop application"
authors = ["Survey Copilot"]
edition = "2021"

[lib]
name = "survey_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

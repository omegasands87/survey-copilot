[package]
name = "survey-copilot"
version = "0.1.0"
description = "Survey Copilot desktop application"
authors = ["Survey Copilot"]
edition = "2021"

[lib]
name = "survey_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"\nrusqlite = { version = "0.32", features = ["bundled"] }\nuuid = { version = "1", features = ["v4", "serde"] }\nchrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", features = [] }
